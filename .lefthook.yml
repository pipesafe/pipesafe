pre-commit:
  parallel: true
  commands:
    build:
      run: bun run build
      stage_fixed: true
    # Checks, does not fix. `oxlint --fix` applies fixes to violations that
    # `oxlint-suppressions.json` suppresses, so running it here would rewrite
    # the code the suppressions exist to defer — including collapsing the
    # `x as T` in the *.typeAssertions.ts files, which is the whole point of
    # those files. Run `bun run lint:fix` by hand, deliberately, and read the
    # diff.
    lint:
      run: bun run lint
    format:
      run: bun run format:fix
      stage_fixed: true
    test:
      run: bun run test:ci
      stage_fixed: true

# The assertion regression net (two full tsc passes) runs before anything
# leaves the machine rather than on every commit — CI enforces it too.
# The build is part of the hook: manifold type-checks against core's dist,
# and pushes from fresh clones / after rebase / after --no-verify commits
# cannot rely on a pre-commit build having run (stale dist = false result).
pre-push:
  commands:
    typecheck-packages:
      run: bun run build && bun run typecheck:packages
