name: Claude Code Review

# Runs .claude/skills/pr-review: a full review first, incremental re-reviews on
# each push, and answers to replies on its threads that don't mention @claude.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    concurrency:
      group: claude-code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
          claude_args: |
            --model opus
            --allowedTools "Agent,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api:*)"

  reply:
    # @claude mentions go to claude.yml; bot authors are skipped so Claude never answers itself.
    if: >-
      github.event_name == 'pull_request_review_comment' &&
      github.event.comment.in_reply_to_id &&
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.comment.body, '@claude')
    concurrency:
      group: claude-code-review-reply-${{ github.event.comment.in_reply_to_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check the thread was opened by the review
        id: thread
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          author=$(gh api repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.in_reply_to_id }} --jq .user.login)
          echo "ours=$([ "$author" = "claude[bot]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.thread.outputs.ours == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude reply
        if: steps.thread.outputs.ours == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment --reply ${{ github.event.comment.id }}"
          claude_args: |
            --model opus
            --allowedTools "Bash(gh pr view:*),Bash(gh api:*)"
