name: Claude Code Review

# Runs .claude/skills/pr-review: a full review first, incremental re-reviews on
# each push, and answers to replies on its threads that don't mention @claude
# (those go to claude.yml). Tool permissions come from the skill's frontmatter;
# only replies get REPLY_TOOLS, so a review run can't edit or push.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'pull_request_review_comment' &&
      github.event.comment.in_reply_to_id &&
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.comment.body, '@claude'))
    concurrency:
      group: claude-code-review-${{ github.event.pull_request.number }}-${{ github.event.comment.in_reply_to_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      REPLY_TOOLS: ",Edit,Write,Bash(git add *),Bash(git commit *),Bash(git push),Bash(bunx eslint *),Bash(bunx prettier *),Bash(bun run build),Bash(bun run typecheck:packages),Bash(bunx vitest run *)"
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check the replied-to thread was opened by the review
        id: thread
        if: github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          author=$(gh api repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.in_reply_to_id }} --jq .user.login)
          [ "$author" = "claude[bot]" ] || echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.thread.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Bun
        if: steps.thread.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.thread.outputs.skip != 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Claude
        if: steps.thread.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment${{ github.event.comment.id && format(' --reply {0}', github.event.comment.id) || '' }}"
          # The action only starts the inline-comment server when its tool is listed here.
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment${{ github.event.comment.id && env.REPLY_TOOLS || '' }}"
